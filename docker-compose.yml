services:
  mongodb:
    image: mongo:8
    container_name: lms-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db


  api:
    build: .
    ports:
      - "3101:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/lms_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - mongodb

volumes:
  mongodb_data: